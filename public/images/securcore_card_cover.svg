<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1f2937" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
  </g>

  <!-- Line numbers column background -->
  <rect x="0" y="0" width="50" height="500" fill="#161b22" opacity="0.6"/>

  <!-- Code font: monospace approximated with tspan -->
  <style>
    .ln { font-family: 'Courier New', monospace; font-size: 11px; fill: #484f58; }
    .kw { font-family: 'Courier New', monospace; font-size: 11px; fill: #ff7b72; }
    .tp { font-family: 'Courier New', monospace; font-size: 11px; fill: #79c0ff; }
    .fn { font-family: 'Courier New', monospace; font-size: 11px; fill: #d2a8ff; }
    .cm { font-family: 'Courier New', monospace; font-size: 11px; fill: #8b949e; }
    .st { font-family: 'Courier New', monospace; font-size: 11px; fill: #a5d6ff; }
    .nm { font-family: 'Courier New', monospace; font-size: 11px; fill: #79c0ff; }
    .op { font-family: 'Courier New', monospace; font-size: 11px; fill: #ff7b72; }
    .pl { font-family: 'Courier New', monospace; font-size: 11px; fill: #e6edf3; }
    .nu { font-family: 'Courier New', monospace; font-size: 11px; fill: #79c0ff; }
  </style>

  <!-- Line 1 -->
  <text x="10" y="22" class="ln">1</text>
  <text x="60" y="22"><tspan class="cm">// AVL Tree — O(log n) sorted password vault</tspan></text>

  <!-- Line 2 -->
  <text x="10" y="42" class="ln">2</text>
  <text x="60" y="42"><tspan class="kw">struct </tspan><tspan class="tp">AVLNode</tspan><tspan class="pl"> {</tspan></text>

  <!-- Line 3 -->
  <text x="10" y="62" class="ln">3</text>
  <text x="60" y="62"><tspan class="pl">    </tspan><tspan class="tp">string</tspan><tspan class="pl"> key;      </tspan><tspan class="cm">// site domain</tspan></text>

  <!-- Line 4 -->
  <text x="10" y="82" class="ln">4</text>
  <text x="60" y="82"><tspan class="pl">    </tspan><tspan class="tp">string</tspan><tspan class="pl"> password; </tspan><tspan class="cm">// encrypted entry</tspan></text>

  <!-- Line 5 -->
  <text x="10" y="102" class="ln">5</text>
  <text x="60" y="102"><tspan class="pl">    </tspan><tspan class="kw">int</tspan><tspan class="pl"> height;</tspan></text>

  <!-- Line 6 -->
  <text x="10" y="122" class="ln">6</text>
  <text x="60" y="122"><tspan class="pl">    </tspan><tspan class="tp">AVLNode</tspan><tspan class="pl">* left;  </tspan><tspan class="tp">AVLNode</tspan><tspan class="pl">* right;</tspan></text>

  <!-- Line 7 -->
  <text x="10" y="142" class="ln">7</text>
  <text x="60" y="142"><tspan class="pl">    </tspan><tspan class="tp">AVLNode</tspan><tspan class="pl">(</tspan><tspan class="tp">string</tspan><tspan class="pl"> k, </tspan><tspan class="tp">string</tspan><tspan class="pl"> p)</tspan></text>

  <!-- Line 8 -->
  <text x="10" y="162" class="ln">8</text>
  <text x="60" y="162"><tspan class="pl">        : key(k), password(p), height(</tspan><tspan class="nu">1</tspan><tspan class="pl">),</tspan></text>

  <!-- Line 9 -->
  <text x="10" y="182" class="ln">9</text>
  <text x="60" y="182"><tspan class="pl">          left(</tspan><tspan class="kw">nullptr</tspan><tspan class="pl">), right(</tspan><tspan class="kw">nullptr</tspan><tspan class="pl">) {}</tspan></text>

  <!-- Line 10 -->
  <text x="10" y="202" class="ln">10</text>
  <text x="60" y="202"><tspan class="pl">};</tspan></text>

  <!-- Line 11 blank -->
  <text x="10" y="222" class="ln">11</text>

  <!-- Line 12 -->
  <text x="10" y="242" class="ln">12</text>
  <text x="60" y="242"><tspan class="cm">// Self-balancing insert with rotation</tspan></text>

  <!-- Line 13 -->
  <text x="10" y="262" class="ln">13</text>
  <text x="60" y="262"><tspan class="tp">AVLNode</tspan><tspan class="pl">* </tspan><tspan class="fn">insert</tspan><tspan class="pl">(</tspan><tspan class="tp">AVLNode</tspan><tspan class="pl">* node, </tspan><tspan class="tp">string</tspan><tspan class="pl"> key, </tspan><tspan class="tp">string</tspan><tspan class="pl"> pass) {</tspan></text>

  <!-- Line 14 -->
  <text x="10" y="282" class="ln">14</text>
  <text x="60" y="282"><tspan class="pl">    </tspan><tspan class="kw">if</tspan><tspan class="pl"> (!node) </tspan><tspan class="kw">return new</tspan><tspan class="tp"> AVLNode</tspan><tspan class="pl">(key, pass);</tspan></text>

  <!-- Line 15 -->
  <text x="10" y="302" class="ln">15</text>
  <text x="60" y="302"><tspan class="pl">    </tspan><tspan class="kw">if</tspan><tspan class="pl"> (key </tspan><tspan class="op">&lt;</tspan><tspan class="pl"> node-&gt;key)</tspan></text>

  <!-- Line 16 -->
  <text x="10" y="322" class="ln">16</text>
  <text x="60" y="322"><tspan class="pl">        node-&gt;left  </tspan><tspan class="op">=</tspan><tspan class="pl"> </tspan><tspan class="fn">insert</tspan><tspan class="pl">(node-&gt;left,  key, pass);</tspan></text>

  <!-- Line 17 -->
  <text x="10" y="342" class="ln">17</text>
  <text x="60" y="342"><tspan class="pl">    </tspan><tspan class="kw">else if</tspan><tspan class="pl"> (key </tspan><tspan class="op">&gt;</tspan><tspan class="pl"> node-&gt;key)</tspan></text>

  <!-- Line 18 -->
  <text x="10" y="362" class="ln">18</text>
  <text x="60" y="362"><tspan class="pl">        node-&gt;right </tspan><tspan class="op">=</tspan><tspan class="pl"> </tspan><tspan class="fn">insert</tspan><tspan class="pl">(node-&gt;right, key, pass);</tspan></text>

  <!-- Line 19 -->
  <text x="10" y="382" class="ln">19</text>
  <text x="60" y="382"><tspan class="pl">    </tspan><tspan class="kw">else return</tspan><tspan class="pl"> node; </tspan><tspan class="cm">// duplicate site — skip</tspan></text>

  <!-- Line 20 -->
  <text x="10" y="402" class="ln">20</text>

  <!-- Line 21 -->
  <text x="10" y="422" class="ln">21</text>
  <text x="60" y="422"><tspan class="pl">    node-&gt;height </tspan><tspan class="op">=</tspan><tspan class="pl"> </tspan><tspan class="nu">1</tspan><tspan class="pl"> + </tspan><tspan class="fn">max</tspan><tspan class="pl">(</tspan><tspan class="fn">height</tspan><tspan class="pl">(node-&gt;left), </tspan><tspan class="fn">height</tspan><tspan class="pl">(node-&gt;right));</tspan></text>

  <!-- Line 22 -->
  <text x="10" y="442" class="ln">22</text>
  <text x="60" y="442"><tspan class="pl">    </tspan><tspan class="kw">return </tspan><tspan class="fn">rebalance</tspan><tspan class="pl">(node);</tspan></text>

  <!-- Line 23 -->
  <text x="10" y="462" class="ln">23</text>
  <text x="60" y="462"><tspan class="pl">}</tspan></text>

  <!-- Line 24 -->
  <text x="10" y="482" class="ln">24</text>
  <text x="60" y="482"><tspan class="cm">// unordered_map&lt;string, string&gt; vaultIndex; — O(1) lookup</tspan></text>

  <!-- Highlight active line glow (line 13-14 area) -->
  <rect x="0" y="250" width="800" height="40" fill="#388bfd" opacity="0.06" rx="2"/>

  <!-- Purple glow accent top-right -->
  <ellipse cx="700" cy="60" rx="120" ry="60" fill="#7c3aed" opacity="0.08"/>

  <!-- Green glow bottom-left -->
  <ellipse cx="100" cy="440" rx="100" ry="50" fill="#059669" opacity="0.07"/>
</svg>
