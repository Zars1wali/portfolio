  <text x="605" y="198" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8">public:</text>
  <text x="620" y="214" font-family="'Courier New', monospace" font-size="10" fill="#f43f5e">virtual void <tspan fill="#34d399">showProfile</tspan>() = 0;</text>
  <text x="605" y="230" font-family="'Courier New', monospace" font-size="10" fill="#f8fafc">&#125;;</text>

