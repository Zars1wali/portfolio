  <text x="605" y="270" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8">public:</text>
  <text x="620" y="286" font-family="'Courier New', monospace" font-size="10" fill="#f43f5e">void <tspan fill="#34d399">showProfile</tspan>() <tspan fill="#f43f5e">override</tspan> &#123; ... &#125;</text>
